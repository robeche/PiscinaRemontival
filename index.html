<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ayuda en clase · 3º</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e4e0d8;
    --a: #2f6fdb; --a-soft: #e9f0fd; --b: #d2602a; --b-soft: #fcefe7;
    --ok: #2e8b57; --warn-bg: #fff6d6; --warn-ink: #6b5400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171b; --card: #1f2228; --ink: #eceef1; --muted: #9aa0a8; --line: #2e323a;
      --a: #79a6ff; --a-soft: #1d283b; --b: #ff9b6a; --b-soft: #36241a;
      --ok: #5ccf8e; --warn-bg: #3a3214; --warn-ink: #f2dc8b;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header, main { max-width: 820px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
  header { padding-top: 28px; padding-bottom: 8px; }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  header p { margin: 0; color: var(--muted); }
  main { padding-top: 8px; padding-bottom: 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }

  .aviso { background: var(--warn-bg); color: var(--warn-ink); border-radius: 10px;
           padding: 10px 14px; font-size: .9rem; }
  .cargando { color: var(--muted); padding: 24px 0; text-align: center; }

  .dia { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .dia-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .dia h2 { margin: 0; font-size: 1.05rem; }
  .cuenta { font-size: .8rem; color: var(--muted); white-space: nowrap; }
  .cuenta.completo { color: var(--ok); font-weight: 600; }

  /* Próximo lunes resaltado */
  .dia.proximo { border: 2px solid var(--a); box-shadow: 0 6px 20px rgba(47, 111, 219, .18); padding: 16px 18px; }
  .dia.proximo h2 { font-size: 1.2rem; }
  .etiqueta { display: inline-block; background: var(--a); color: #fff; font-size: .72rem; font-weight: 700;
              letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; margin-bottom: 6px; }

  .grupos { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
  @media (max-width: 560px) { .grupos { grid-template-columns: minmax(0, 1fr); } }
  .grupo { border-radius: 10px; padding: 10px; background: var(--a-soft); --c: var(--a); }
  .grupo.b { background: var(--b-soft); --c: var(--b); }
  .grupo h3 { margin: 0 0 2px; font-size: .8rem; letter-spacing: .06em; color: var(--c); }

  .plaza { display: flex; gap: 6px; align-items: center; min-height: 40px; margin-top: 6px; }
  .plaza input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line);
                 border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; }
  .plaza input:focus { outline: 2px solid var(--c); outline-offset: -1px; }
  .nombre { flex: 1; min-width: 0; padding: 8px 10px; background: var(--card); border-radius: 8px;
            font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  .apuntar { background: var(--c); color: #fff; font-weight: 600; }
  .quitar { background: transparent; color: var(--muted); padding: 6px 8px; font-size: .85rem; }
  .quitar:hover { color: var(--ink); }

  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
           background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
           opacity: 0; transition: .25s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.ver { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
  <h1>Ayuda en clase · 3º</h1>
  <p>Elige un lunes y apúntate en el grupo de tu hijo/a. Hay 2 plazas por grupo.</p>
</header>
<main id="app">
  <div class="cargando">Cargando…</div>
</main>
<div class="toast" id="toast"></div>

<script>
// ================== CONFIGURACIÓN ==================
// Pega aquí la URL de tu Apps Script (termina en /exec).
// Si la dejas vacía, la web funciona en "modo prueba" guardando solo en este navegador.
const API_URL = 'https://script.google.com/macros/s/AKfycbzQbewmdD_0TBsuy9FCDNydAQuARAvvpUZyn7lwPGrcsWmeChi_vwN8LXEqhNua759Kdg/exec';

const FECHA_FIN = new Date(2026, 11, 31); // 31 de diciembre de 2026
const GRUPOS = ['3A', '3B'];
const PLAZAS = [1, 2];
// Lunes sin clase que no deben aparecer (formato 'AAAA-MM-DD'), p. ej. vacaciones:
const EXCLUIR = [];
// ===================================================

const app = document.getElementById('app');
let datos = new Map(); // "fecha|grupo|plaza" -> nombre

const clave = (f, g, p) => `${f}|${g}|${p}`;
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fmt = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });

// Lunes desde hoy (incluido si hoy es lunes) hasta FECHA_FIN. Los pasados no se muestran.
function lunes() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  while (d.getDay() !== 1) d.setDate(d.getDate() + 1);
  const out = [];
  while (d <= FECHA_FIN) {
    if (!EXCLUIR.includes(iso(d))) out.push(new Date(d));
    d.setDate(d.getDate() + 7);
  }
  return out;
}

function setDatos(lista) {
  datos = new Map(lista.map(r => [clave(r.fecha, r.grupo, Number(r.plaza)), r.nombre]));
}

// ---------- Acceso a datos ----------
async function cargar() {
  if (!API_URL) return demoGet();
  const r = await fetch(API_URL);
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.datos;
}

async function enviar(payload) {
  if (!API_URL) return demoPost(payload);
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // evita el preflight CORS
    body: JSON.stringify(payload)
  });
  const j = await r.json();
  if (!j.ok) { if (j.datos) { setDatos(j.datos); pintar(); } throw new Error(j.error); }
  return j.datos;
}

// Modo prueba (sin Apps Script): guarda en localStorage
function demoLeer() { try { return JSON.parse(localStorage.getItem('demo-apuntados') || '[]'); } catch { return []; } }
function demoGuardar(l) { try { localStorage.setItem('demo-apuntados', JSON.stringify(l)); } catch {} }
async function demoGet() { return demoLeer(); }
async function demoPost({ accion, fecha, grupo, plaza, nombre }) {
  let l = demoLeer();
  const i = l.findIndex(r => r.fecha === fecha && r.grupo === grupo && r.plaza === plaza);
  if (accion === 'borrar') { if (i >= 0) l.splice(i, 1); }
  else { if (i >= 0) throw new Error('Esa plaza ya está ocupada'); l.push({ fecha, grupo, plaza, nombre }); }
  demoGuardar(l);
  return l;
}

// ---------- Interfaz ----------
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('ver');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('ver'), 2600);
}

function el(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const h of hijos) e.append(h);
  return e;
}


function plaza(fecha, grupo, p) {
  const nombre = datos.get(clave(fecha, grupo, p));
  if (nombre) {
    const btn = el('button', { class: 'quitar', title: 'Quitar', onclick: async () => {
      if (!confirm(`¿Quitar a ${nombre} de este lunes?`)) return;
      btn.disabled = true;
      try { setDatos(await enviar({ accion: 'borrar', fecha, grupo, plaza: p })); pintar(); toast('Plaza liberada'); }
      catch (e) { toast(e.message || 'Error al guardar'); btn.disabled = false; }
    }}, 'Quitar');
    return el('div', { class: 'plaza' }, el('span', { class: 'nombre', title: nombre }, nombre), btn);
  }
  const input = el('input', { type: 'text', placeholder: 'Tu nombre', maxlength: '40', autocomplete: 'off', name: `n-${fecha}-${grupo}-${p}`, 'aria-label': `Nombre para ${grupo}, plaza ${p}` });
  const apuntar = async () => {
    const n = input.value.trim();
    if (!n) { input.focus(); return; }
    btn.disabled = true; input.disabled = true;
    try { setDatos(await enviar({ accion: 'apuntar', fecha, grupo, plaza: p, nombre: n })); pintar(); toast('¡Apuntada! Gracias 💛'); }
    catch (e) { toast(e.message || 'Error al guardar'); btn.disabled = false; input.disabled = false; }
  };
  input.addEventListener('keydown', e => { if (e.key === 'Enter') apuntar(); });
  const btn = el('button', { class: 'apuntar', onclick: apuntar }, 'Apuntarme');
  return el('div', { class: 'plaza' }, input, btn);
}

function pintar() {
  app.replaceChildren();
  if (!API_URL) app.append(el('div', { class: 'aviso' },
    'Modo prueba: los nombres solo se guardan en este navegador. Añade la URL de Apps Script en API_URL.'));

  const dias = lunes();
  if (!dias.length) { app.append(el('div', { class: 'cargando' }, 'No quedan lunes este año.')); return; }

  dias.forEach((d, idx) => {
    const f = iso(d);
    const proximo = idx === 0;
    const total = GRUPOS.length * PLAZAS.length;
    const llenas = GRUPOS.reduce((s, g) => s + PLAZAS.filter(p => datos.has(clave(f, g, p))).length, 0);
    const titulo = fmt.format(d);
    const hoy = f === iso(new Date());
    app.append(el('section', { class: 'dia' + (proximo ? ' proximo' : '') },
      ...(proximo ? [el('span', { class: 'etiqueta' }, hoy ? 'Hoy' : 'Próximo lunes')] : []),
      el('div', { class: 'dia-cab' },
        el('h2', {}, titulo.charAt(0).toUpperCase() + titulo.slice(1)),
        el('span', { class: 'cuenta' + (llenas === total ? ' completo' : '') }, llenas === total ? 'Completo ✓' : `${llenas}/${total} plazas`)
      ),
      el('div', { class: 'grupos' },
        ...GRUPOS.map((g, i) => el('div', { class: 'grupo' + (i ? ' b' : '') },
          el('h3', {}, g), ...PLAZAS.map(p => plaza(f, g, p))))
      )
    ));
  });
}

async function refrescar() {
  try { setDatos(await cargar()); pintar(); }
  catch (e) { app.replaceChildren(el('div', { class: 'aviso' }, 'No se han podido cargar los datos. Recarga la página.')); }
}

// Recarga al volver a la pestaña para ver lo que han apuntado otras madres
document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.activeElement?.matches('input')) refrescar(); });
refrescar();
</script>
</body>
</html>
